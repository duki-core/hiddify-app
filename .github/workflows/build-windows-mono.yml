name: Build Windows (mono)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # зависимости, кодогенерация, переводы и готовое ядро (скачивается с релиза hiddify-core)
      - name: Prepare
        shell: bash
        run: make windows-prepare

      # portable=true: данные лежат рядом с exe (папка hiddify_portable_data) и не смешиваются
      # с установленной версией (4.1.1 и т.п.)
      - name: Build
        shell: bash
        run: make windows-validate BUILD_ARGS="--dart-define portable=true"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath hiddify-mono-windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-mono-windows
          path: hiddify-mono-windows.zip
          retention-days: 7
